<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Dashboard — Desmond Flanagan</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='21' font-weight='bold' fill='%2396ABE3' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body class="dash-body">

  <header class="dash-header">
    <a class="dash-wordmark" href="/">← Back to site</a>
    <div class="dash-actions">
      <a class="dash-edit" href="/admin/">Edit site</a>
      <button class="dash-logout" id="logout" hidden>Log out</button>
    </div>
  </header>

  <!-- Shown until Identity confirms a logged-in user -->
  <section class="dash-gate" id="gate">
    <h1 class="dash-title">Dashboard</h1>
    <p class="dash-gate-text" id="gate-text">Log in to see submissions.</p>
    <button class="form-submit" id="login">Log in</button>
  </section>

  <main class="dash-main" id="main" hidden>
    <h1 class="dash-title">Dashboard</h1>
    <p class="dash-who" id="who"></p>

    <nav class="dash-views">
      <button class="dash-view-btn active" data-view="photos">Photos</button>
      <button class="dash-view-btn" data-view="castings">Castings</button>
      <button class="dash-view-btn" data-view="submissions">Submissions</button>
    </nav>

    <div id="photos-view"></div>
    <div id="castings-view" hidden></div>

    <div id="submissions-view" hidden>
      <nav class="dash-tabs" id="tabs"></nav>
      <div id="panels"></div>
    </div>
  </main>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
